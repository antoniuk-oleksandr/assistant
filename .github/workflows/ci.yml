name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Generate code
        run: go generate ./...

      - name: Check formatting
        shell: bash
        run: |
          files=$(find . -name '*.go' -not -path './.git/*' -exec gofmt -l {} +)
          if [[ -n "$files" ]]; then
            echo "The following Go files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests with coverage
        run: go test -race -covermode=atomic -coverpkg=./cmd/assistent,./internal/... -coverprofile=coverage.out ./...

      - name: Enforce coverage threshold
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')
          echo "Total coverage: ${total}%"
          awk -v coverage="$total" 'BEGIN { exit !(coverage >= 90) }'
