# Local Hermes configuration for the Scheduled Report Aggregation System.
# The Hermes container should mount this repository at /workspace.

terminal:
  backend: local
  cwd: /workspace

model:
  provider: openai-codex

delegation:
  max_concurrent_children: 3

agent:
  max_turns: 150
  reasoning_effort: medium
  coding_context: true
  coding_instructions:
    - >-
      Before changing code, read /workspace/AGENTS.md, /workspace/ARCHITECTURE.md,
      /workspace/SYSTEM_DESCRIPTION.md, and /workspace/database.md when persistence
      is involved. Read /workspace/TESTING.md for testing work.
    - >-
      Before implementation or review, use Graphify to orient yourself in the
      repository and its documents. Prefer graphify query/explain/path results
      for codebase relationships, then inspect the authoritative source files.
    - >-
      For every implementation task, act as the parent orchestrator and delegate
      sequentially to hermes-dev, hermes-tester, and hermes-reviewer. Do not claim
      completion until the reviewer returns APPROVED or reports a human blocker.
    - >-
      The reviewer is read-only. Classify findings as production_fix, test_fix,
      both, or human_blocker. Delegate production fixes to hermes-dev and test
      fixes to hermes-tester. Run hermes-reviewer again after every fix.
    - >-
      Follow the repository architecture: one Go executable and one main.go,
      Uber Fx, Cobra, Zap, Domain/Application/Infrastructure/Presentation layers,
      Domain-owned ports, explicit mappers, SQLite, and five-minute polling.
    - >-
      Use Ginkgo/Gomega, uber-go/mock, and shared fixtures. Do not introduce
      unrelated infrastructure, message queues, delivery systems, or dynamic plugins.
    - >-
      Use the configured GitHub MCP server for GitHub Projects, issue, repository,
      Git, and pull request operations. Do not use the gh CLI. Work through all
      current Todo project items sequentially. For each item, create a branch from
      the freshly pulled main branch, complete the Developer -> Tester -> Reviewer
      workflow, commit and push the result, create the linked pull request, merge
      it, verify that it is merged and closed, and mark the project item Done.
      After each item, switch the local checkout to main and run git pull
      --ff-only origin main before selecting the next Todo item. Re-read the
      project after every transition; do not rely on a cached item count and do
      not stop while Todo items remain unless a genuine blocker is reported.

mcp_servers:
  github:
    url: "https://api.githubcopilot.com/mcp/x/all"
    headers:
      Authorization: "Bearer ${env:GITHUB_PERSONAL_ACCESS_TOKEN}"
      X-MCP-Toolsets: "context,projects,issues,repos,git,pull_requests"
    trust: full
    timeout: 180
    connect_timeout: 60

platform_toolsets:
  cli:
    - delegation
    - file
    - terminal
    - todo
    - code_execution

skills:
  trusted_project_dirs:
    - /workspace
