name: report-system-local

services:
  hermes:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.hermes
    image: report-system-hermes:local
    container_name: report-system-hermes
    restart: unless-stopped
    env_file:
      - ${HERMES_DATA_DIR:-${HOME}/.hermes/assistent}/.env
    pids_limit: 512
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    working_dir: /workspace
    command:
      - sh
      - -c
      - >-
        cp /workspace/.agents/hermes/config.yaml /opt/data/config.yaml &&
        /opt/hermes/bin/hermes skills trust /workspace &&
        exec /opt/hermes/bin/hermes gateway run
    stdin_open: true
    tty: true
    environment:
      HERMES_UID: "${HERMES_UID:-1000}"
      HERMES_GID: "${HERMES_GID:-1000}"
      HERMES_WRITE_SAFE_ROOT: /workspace:/opt/data
      HERMES_YOLO_MODE: "1"
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
    volumes:
      - ../..:/workspace
      - ${HERMES_DATA_DIR:-${HOME}/.hermes/assistent}:/opt/data

  temporal:
    image: temporalio/temporal:latest
    container_name: report-system-temporal
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-ip
      - 0.0.0.0
      - --ui-port
      - "8233"
      - --db-filename
      - /home/temporal/temporal.db
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/home/temporal

volumes:
  temporal-data:
